};
const InlineCalendar = ({ value, onChange, darkMode, onToggle, isExpanded, textSize = "text-sm" }) => {
  const parseSafeDate = (val) => { if (!val) return null; let d = new Date(val.includes('-') && val.length === 10 ? val + 'T00:00:00' : val); return isNaN(d.getTime()) ? null : d; };
  const selectedDate = parseSafeDate(value); const [currentMonth, setCurrentMonth] = useState(selectedDate || new Date());
  useEffect(() => { if (isExpanded && selectedDate) setCurrentMonth(selectedDate); }, [isExpanded, value]);
  const formatDisplayDate = (dateStr) => { const d = parseSafeDate(dateStr); if (!d) return 'Select date'; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  const getDaysInMonth = (date) => { const year = date.getFullYear(); const month = date.getMonth(); const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0); const daysInMonth = lastDay.getDate(); const startingDayOfWeek = firstDay.getDay(); const days = []; for (let i = 0; i < startingDayOfWeek; i++) days.push(null); for (let i = 1; i <= daysInMonth; i++) days.push(i); return days; };
  const handleDayClick = (day) => { if (day) { const year = currentMonth.getFullYear(); const month = currentMonth.getMonth(); const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; onChange(dateStr); onToggle(); } };
  const changeMonth = (delta) => { setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + delta, 1)); };
  const days = getDaysInMonth(currentMonth); const monthName = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const pyClass = textSize === 'text-base' || textSize === 'text-lg' ? 'py-3' : 'py-2';
  return (
    <div className="w-full relative dropdown-container">
      <button type="button" onClick={onToggle} className={`border rounded-lg px-4 ${pyClass} hover:border-blue-400 focus:outline-none focus:border-blue-500 w-full text-left flex items-center justify-between`} style={{ borderColor: isExpanded ? '#3b82f6' : (darkMode ? '#4a4a4a' : '#e5e7eb'), backgroundColor: darkMode ? '#3a3a3a' : '#ffffff', color: darkMode ? '#ffffff' : '#000000', minHeight: '38px', boxShadow: isExpanded ? '0 0 0 3px rgba(59, 130, 246, 0.2)' : 'none', transition: 'all .2s ease' }}>
        <span className={`font-semibold tracking-wide ${textSize}`}>{formatDisplayDate(value)}</span><div className="chevron-rotate" style={{ transform: isExpanded ? 'rotate(180deg)' : 'rotate(0deg)' }}><ChevronDown /></div>
      </button>
      <div className={`mt-1 rounded-lg shadow-xl border-2 z-[60] absolute left-0 top-full dropdown-menu ${isExpanded ? 'dropdown-open' : 'dropdown-closed'}`} style={{ backgroundColor: darkMode ? '#2a2a2a' : '#ffffff', borderColor: '#3b82f6', padding: '16px', width: '360px' }}>
        <div className="flex items-center justify-between mb-4">
          <button type="button" onClick={() => changeMonth(-1)} className="p-2 rounded-lg hover:scale-110 transition-transform font-bold text-xl" style={{ backgroundColor: darkMode ? '#3a3a3a' : '#f3f4f6', color: darkMode ? '#ffffff' : '#000000' }}>&lt;</button>
          <span className="font-bold text-lg" style={{ color: darkMode ? '#ffffff' : '#000000' }}>{monthName}</span>
          <button type="button" onClick={() => changeMonth(1)} className="p-2 rounded-lg hover:scale-110 transition-transform font-bold text-xl" style={{ backgroundColor: darkMode ? '#3a3a3a' : '#f3f4f6', color: darkMode ? '#ffffff' : '#000000' }}>&gt;</button>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-2"> {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(day => <div key={day} className="text-center font-bold text-xs" style={{ color: darkMode ? '#9ca3af' : '#6b7280' }}>{day}</div>) } </div>
        <div className="grid grid-cols-7 gap-1"> {days.map((day, idx) => { if (!day) return <div key={idx} />; const isSelected = selectedDate && selectedDate.getDate() === day && selectedDate.getMonth() === currentMonth.getMonth() && selectedDate.getFullYear() === currentMonth.getFullYear(); return <button key={idx} type="button" onClick={() => handleDayClick(day)} className="rounded-lg text-sm font-semibold transition-transform duration-300 hover:scale-110" style={{ padding: '8px', backgroundColor: isSelected ? '#3b82f6' : (darkMode ? '#3a3a3a' : '#f9fafb'), color: isSelected ? '#ffffff' : (darkMode ? '#ffffff' : '#000000'), border: isSelected ? '2px solid #3b82f6' : '1px solid ' + (darkMode ? '#4a4a4a' : '#e5e7eb'), boxShadow: isSelected ? '0 0 15px 5px rgba(59, 130, 246, 0.8)' : 'none' }}>{day}</button>; }) } </div>
      </div>
    </div>
  );
};

const SimpleBarChart = ({ data, theme }) => {
    const keys = Object.keys(data); if (keys.length === 0) return <div className="text-gray-500 italic p-4 text-center">No data available to chart</div>;
    const max = Math.max(...Object.values(data), 1);
    
    const chartColors = [theme.primary, theme.secondary, theme.accent, theme.highlight, '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
    
    return (
        <div className="flex items-end justify-around gap-2 h-48 w-full border-b pb-2 px-2 pt-6" style={{ borderColor: theme.darkMode ? '#4a4a4a' : '#e5e7eb' }}> 
            {keys.map((key, index) => {
                const color = chartColors[index % chartColors.length];
                return ( 
                <div key={key} className="flex flex-col items-center justify-end w-full group relative" style={{ height: '100%' }}>
                    <div className="opacity-0 group-hover:opacity-100 transition-opacity absolute -top-8 bg-gray-800 text-white text-xs rounded-lg px-2 py-1 z-10 pointer-events-none whitespace-nowrap">{key}: {data[key]}</div>
                    <div className="w-full rounded-t-lg transition-all duration-1000 ease-out hover:opacity-80" style={{ height: `${(data[key] / max) * 100}%`, backgroundColor: color, minHeight: data[key] > 0 ? '4px' : '0' }}></div>
                    <div className="text-[10px] truncate w-full text-center mt-2 font-medium" style={{ color: theme.textSecondary }} title={key}>{key}</div>
                </div> 
                )
            })} 
        </div>
    )
};

const SimplePieChart = ({ data, colors, theme }) => {
    const keys = Object.keys(data); if (keys.length === 0) return <div className="text-gray-500 italic p-4 text-center">No data available to chart</div>;
    const total = Object.values(data).reduce((a, b) => a + b, 0); let start = 0;
    const fallbackColors = [theme.primary, theme.secondary, theme.accent, theme.highlight, '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
    
    const gradients = keys.map((key, index) => { 
        const percent = (data[key] / total) * 100; 
        const color = colors && colors[key] ? colors[key] : fallbackColors[index % fallbackColors.length]; 
        const str = `${color} ${start}% ${start + percent}%`; 
        start += percent; 
        return str; 
    }).join(', ');
    
    return (
        <div className="flex flex-col md:flex-row items-center gap-8">
            <div style={{ width: '220px', height: '220px', borderRadius: '50%', background: `conic-gradient(${gradients})`, boxShadow: '0 10px 25px rgba(0,0,0,0.1)' }} className="flex-shrink-0 animate-scale-in" />
            <div className="flex flex-col gap-2 w-full max-h-48 overflow-y-auto pr-2"> {keys.map((key, index) => { 
                    const percent = Math.round((data[key] / total) * 100); 
                    const color = colors && colors[key] ? colors[key] : fallbackColors[index % fallbackColors.length];
                    return ( 
                        <div key={key} className="flex items-center justify-between p-2 rounded-lg" style={{ backgroundColor: theme.darkMode ? '#3a3a3a' : '#f9fafb' }}>
                            <div className="flex items-center gap-2"> <div className="w-4 h-4 rounded-full" style={{ backgroundColor: color }}></div> <span className="font-medium text-sm" style={{ color: theme.textPrimary }}>{key || 'Unspecified'}</span> </div>
                            <div className="flex items-center gap-3"> <span className="text-sm font-bold" style={{ color: theme.textPrimary }}>{data[key]}</span> <span className="text-xs text-gray-500 w-8 text-right">{percent}%</span> </div>
                        </div> 
                    ) 
                }) } 
            </div>
        </div>
    );
};

const SimpleLineChart = ({ data, theme }) => {
    const entries = Object.entries(data);
    const containerRef = useRef(null);
    const [containerWidth, setContainerWidth] = useState(800);

    useEffect(() => {
        const updateWidth = () => {
            if (containerRef.current) {
                setContainerWidth(containerRef.current.clientWidth);
            }
        };
        setTimeout(updateWidth, 50); 
        window.addEventListener('resize', updateWidth);
        return () => window.removeEventListener('resize', updateWidth);
    }, [data]);

    if (entries.length === 0) return <div className="text-gray-500 italic p-4 text-center">No data available to chart</div>;
    
    const maxVal = Math.max(...entries.map(e => e[1]), 1);
    const yMax = Math.ceil(maxVal * 1.1); 
    
    const paddingLeft = 40;
    const paddingRight = 30;
    const paddingTop = 30;
    const paddingBottom = 40;
    
    // Dynamic width expansion based on data density
    const calculatedWidth = entries.length * 80 + paddingLeft + paddingRight;
    const width = Math.max(containerWidth || 800, calculatedWidth); 
    const height = 300;
    
    const graphWidth = width - paddingLeft - paddingRight;
    const graphHeight = height - paddingTop - paddingBottom;
    
    const getX = (index, length) => {
        if (length === 1) return paddingLeft + graphWidth / 2;
        return paddingLeft + (index / (length - 1)) * graphWidth;
    };

    const points = entries.map((entry, index) => {
        const x = getX(index, entries.length);
        const y = paddingTop + graphHeight - ((entry[1] / yMax) * graphHeight);
        return `${x},${y}`;
    }).join(' ');

    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(pct => {
        const y = paddingTop + graphHeight - (pct * graphHeight);
        const val = Math.round(pct * yMax);
        return (
            <g key={pct}>
                <line x1={paddingLeft} y1={y} x2={width - paddingRight} y2={y} stroke={theme.darkMode ? '#4a4a4a' : '#e5e7eb'} strokeWidth="1" strokeDasharray={pct === 0 ? "0" : "4 4"} />
                <text x={paddingLeft - 10} y={y + 4} textAnchor="end" fill={theme.textSecondary} fontSize="12">{val}</text>
            </g>
        );
    });

    return (
        <div ref={containerRef} className="w-full overflow-x-auto hide-native-scroll relative pt-4 flex justify-start">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ height: '300px', width: `${width}px`, minWidth: '100%' }} preserveAspectRatio="xMidYMid meet">
                {gridLines}
                <polyline fill="none" stroke={theme.primary} strokeWidth="4" points={points} strokeLinejoin="round" />
                {entries.map((entry, index) => {
                    const x = getX(index, entries.length);
                    const y = paddingTop + graphHeight - ((entry[1] / yMax) * graphHeight);
                    return (
                        <g key={index} className="group cursor-pointer">
                            <circle cx={x} cy={y} r="6" fill={theme.cardBg} stroke={theme.primary} strokeWidth="3" className="transition-all duration-300 group-hover:r-8" />
                            <text x={x} y={y - 15} textAnchor="middle" fill={theme.textPrimary} fontSize="14" fontWeight="bold" className="opacity-0 group-hover:opacity-100 transition-opacity">{entry[1]}</text>
                            <text x={x} y={height - 10} textAnchor="middle" fill={theme.textSecondary} fontSize="12" className="opacity-80">{entry[0]}</text>
                        </g>
                    );
                })}
            </svg>
        </div>
    );
};

const getTextColor = (bgColor) => { if(!bgColor) return '#ffffff'; const hex = bgColor.replace('#', ''); const r = parseInt(hex.substr(0, 2), 16); const g = parseInt(hex.substr(2, 2), 16); const b = parseInt(hex.substr(4, 2), 16); const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255; return luminance > 0.5 ? '#1f2937' : '#ffffff'; };

const defaultThemes = {

light (COMPLETED)</label><input type="color" value={customTheme.highlight} onChange={(e) => setCustomTheme({ ...customTheme, highlight: e.target.value })} className="w-full h-10 rounded-lg border border-gray-300 cursor-pointer" /></div> </div> <button onClick={() => { if (!customTheme.name.trim()) { alert('Please enter a theme name!'); return; } const updatedThemes = { ...customThemes }; if (editingThemeName && editingThemeName !== customTheme.name) { delete updatedThemes[editingThemeName]; } updatedThemes[customTheme.name] = { ...customTheme }; setCustomThemes(updatedThemes); setSettings({ ...settings, colorTheme: customTheme.name }); setCustomTheme({ name: '', background: '#ffffff', cardBg: '#ffffff', primary: '#3b82f6', secondary: '#8b5cf6', accent: '#10b981', highlight: '#f59e0b', dark: '#1f2937', textPrimary: '#1f2937', textSecondary: '#6b7280' }); setEditingThemeName(null); setShowCustomThemeCreator(false); }} className="w-full py-2 px-4 bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 text-white rounded-lg font-bold transition-all">Save Theme</button> </div> </div> )} </div> ) } </div> <div className="space-y-4"> <div className="p-4 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-lg border-2 border-blue-200"> <h4 className="font-bold text-gray-900 mb-1 flex items-center gap-2">Data Export Management</h4> <p className="text-sm text-gray-600 mb-4">Download your entire dashboard data as a JSON backup or export to Excel as a CSV.</p> <div className="space-y-3"> <button onClick={exportJSON} className="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium flex justify-center items-center gap-2 transition-colors"><Save size={16} /> Export JSON (Backup)</button> <button onClick={() => setShowExportModal(true)} className="w-full px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium flex justify-center items-center gap-2 transition-colors"><Download size={16} /> Export to Excel (CSV)</button> </div> </div> </div> </div> </div> </div> )}
      
      {recentlyDeleted && (
        <div className="fixed bottom-4 right-4 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-2xl flex items-center gap-4 z-50 animate-fade-in">
            <span>Item deleted.</span>
            <button 
                onClick={() => {
                    setTasks(prev => [...prev, recentlyDeleted]);
                    setRecentlyDeleted(null);
                }} 
                className="text-blue-400 font-bold hover:text-blue-300 transition-colors">
                Undo
            </button>
        </div>
      )}
    </div>
  );
