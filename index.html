<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPACT DataTrak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat mode for native JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #3b82f6; --bg: #f9fafb; --card: #ffffff; --text: #1f2937; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--text); }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .animate-scale-in { animation: scaleIn 0.3s cubic-bezier(1.5, 0.1, 0.25, 1); }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .calendar-popup { animation: slideDown 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .dragging { opacity: 0.4; background: rgba(0,0,0,0.05); }
        .drag-over-row { box-shadow: inset 0 0 0 2px #3b82f6; background-color: rgba(59, 130, 246, 0.1); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ==========================================
        // 1. FIREBASE CONFIGURATION & INITIALIZATION
        // ==========================================
        const firebaseConfig = {  
            apiKey: "AIzaSyCEAoWW1iGQJz9cNJINvONIDaidXLkxK8s",  
            authDomain: "impact-datatrak.firebaseapp.com",  
            projectId: "impact-datatrak",  
            storageBucket: "impact-datatrak.firebasestorage.app",  
            messagingSenderId: "489513066612",  
            appId: "1:489513066612:web:d8540498107aad77cff121",  
            databaseURL: "https://impact-datatrak-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            console.log('Firebase initialized successfully');
        }
        const auth = firebase.auth();
        const db = firebase.database();

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        let appState = {
            user: null,
            loading: true,
            email: '', password: '', authError: '',
            tasks: [],
            columns: {},
            columnOrder: [],
            columnWidths: {},
            settings: { darkMode: false, useTheme: false, colorTheme: 'None' },
            customThemes: {},
            expandedGroups: { group1: true, group2: true },
            showSettings: false,
            showAnalytics: false,
            dragInfo: null // { type: 'row'|'col', source: id }
        };

        // Default Data Definitions
        const initialColumns = {
            timestamp: { label: 'Timestamp', icon: 'calendar' }, fullName: { label: 'Full Name', icon: 'user' }, phone: { label: 'Phone Number', icon: 'none' },
            email: { label: 'Email Address', icon: 'none' }, currentStatus: { label: 'Current Status', icon: 'none' }, branchOfService: { label: 'Branch of Service', icon: 'none' },
            agreeToContact: { label: 'Agree to Contact', icon: 'none' }, mos: { label: 'MOS / Job Specialty', icon: 'none' }, payGrade: { label: 'Pay Grade', icon: 'none' },
            etsDate: { label: 'ETS / Retirement Date', icon: 'calendar' }, terminalLeave: { label: 'Terminal Leave Date', icon: 'calendar' }, location: { label: 'Location (City, State)', icon: 'none' },
            transportation: { label: 'Reliable Transportation?', icon: 'none' }, opportunities: { label: 'Opportunities Interested In', icon: 'none' }, skills: { label: 'Skills/Experience', icon: 'none' },
            areasOfInterest: { label: 'Areas of Interest', icon: 'none' }, availability: { label: 'Availability/Limitations', icon: 'none' }, pipelineStatus: { label: 'Pipeline Status', icon: 'none' }
        };
        const initialOrder = ['fullName','branchOfService','email','phone','timestamp','agreeToContact','mos','payGrade','etsDate','terminalLeave','location','transportation','opportunities','skills','areasOfInterest','availability','currentStatus','pipelineStatus'];
        const defaultThemes = { 'None': {bg:'#fff', card:'#fff', primary:'#A4243B', sec:'#D8C99B', acc:'#D8973C', hl:'#BD632F', txt:'#1f2937'}, 'Ocean Bliss': {bg:'#FFFDF7', card:'#FFFDF7', primary:'#0A2342', sec:'#2CA58D', acc:'#84BC9C', hl:'#F46197', txt:'#1f2937'}, 'Lavender Dream': {bg:'#F8F7FF', card:'#fff', primary:'#6B5B95', sec:'#B8A9C9', acc:'#88B0D3', hl:'#E8B4B8', txt:'#1f2937'} };
        const branchColors = { 'Army':'#4B5320','Navy':'#000080','Air Force':'#00308F','Marines':'#990000','Coast Guard':'#00529B','Space Force':'#000000','Not started':'#9ca3af' };

        // ==========================================
        // 3. UTILITY FUNCTIONS
        // ==========================================
        const saveLocal = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        const loadLocal = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
        const hexToRgb = (hex) => { const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16); return `rgb(${r},${g},${b})`; };
        const getContrastColor = (hex) => { const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16), yiq=((r*299)+(g*587)+(b*114))/1000; return (yiq >= 128) ? '#000000' : '#ffffff'; };
        const formatDate = (d) => { if(!d) return 'Select date'; let dt=new Date(d); return isNaN(dt)?d: dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };

        // ==========================================
        // 4. FIREBASE SYNC LOGIC
        // ==========================================
        function initSync(user) {
            if (!user || !db) return;
            const basePath = `userData/${user.uid}`;
            let loaded = 0; const total = 6;
            const checkLoad = () => { loaded++; if(loaded===total) render(); };

            db.ref(`${basePath}/tasks`).on('value', s => { appState.tasks = s.val() || []; checkLoad(); });
            db.ref(`${basePath}/settings`).on('value', s => { appState.settings = {...appState.settings, ...s.val()}; checkLoad(); });
            db.ref(`${basePath}/columns`).on('value', s => { if(s.val()) { appState.columns=s.val(); saveLocal('cols', appState.columns); } checkLoad(); });
            db.ref(`${basePath}/columnOrder`).on('value', s => { if(s.val()) { appState.columnOrder=s.val(); saveLocal('ord', appState.columnOrder); } checkLoad(); });
            db.ref(`${basePath}/columnWidths`).on('value', s => { if(s.val()) { appState.columnWidths=s.val(); saveLocal('wid', appState.columnWidths); } checkLoad(); });
            db.ref(`${basePath}/customThemes`).on('value', s => { if(s.val()) { appState.customThemes=s.val(); saveLocal('themes', appState.customThemes); } checkLoad(); });

            // Sync back to DB on state change
            watchState('tasks', `${basePath}/tasks`);
            watchState('settings', `${basePath}/settings`);
            watchState('columns', `${basePath}/columns`);
            watchState('columnOrder', `${basePath}/columnOrder`);
            watchState('columnWidths', `${basePath}/columnWidths`);
            watchState('customThemes', `${basePath}/customThemes`);
        }

        function watchState(key, path) {
            let timeout;
            new MutationObserver(() => clearTimeout(timeout)).observe(document.body); // placeholder
            appState[`on${key.charAt(0).toUpperCase()+key.slice(1)}Change`] = (val) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => { if(db && appState.user) db.ref(path).set(val); saveLocal(key, val); }, 300);
            };
        }

        // ==========================================
        // 5. UI RENDERING ENGINE (Vanilla JS)
        // ==========================================
        function render() {
            const root = document.getElementById('app');
            if (appState.loading) { root.innerHTML = '<div class="flex h-screen items-center justify-center bg-gray-900 text-white text-xl animate-pulse">Loading...</div>'; return; }
            
            // Apply Theme to CSS Variables
            const t = appState.settings.useTheme ? {...defaultThemes[appState.settings.colorTheme] || defaultThemes['None'], ...appState.customThemes[appState.settings.colorTheme]} : defaultThemes['None'];
            if(appState.settings.darkMode) { t.bg='#1f2937'; t.card='#374151'; t.txt='#f9fafb'; }
            root.style.backgroundColor = t.bg;

            if (!appState.user) {
                root.innerHTML = `
                <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 animate-scale-in">
                    <div class="text-center mb-8"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" class="mx-auto mb-4"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><h1 class="text-3xl font-bold text-gray-900">IMPACT DataTrak</h1></div>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <input type="email" placeholder="your@email.com" value="${appState.email}" oninput="appState.email=this.value" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"/>
                        <input type="password" placeholder="........" value="${appState.password}" oninput="appState.password=this.value" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"/>
                        ${appState.authError ? `<div class="bg-red-50 text-red-700 px-4 py-2 rounded text-sm">${appState.authError}</div>` : ''}
                        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition">Sign In</button>
                    </form>
                </div>`;
            } else {
                const themes = {...defaultThemes, ...appState.customThemes};
                const activeTheme = appState.settings.useTheme ? (themes[appState.settings.colorTheme] || defaultThemes['None']) : defaultThemes['None'];
                
                root.innerHTML = `
                <div class="p-4 max-w-[1800px] mx-auto">
                    <!-- Header -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 p-4 bg-white rounded-xl shadow-sm">
                        <div>
                            <h1 class="text-3xl font-extrabold tracking-tight" style="color:${activeTheme.txt}">IMPACT DataTrak</h1>
                            <div class="flex items-center gap-2 text-xs font-semibold text-green-600 mt-1"><div class="w-2 h-2 rounded-full bg-green-500"></div> Connected to Firebase</div>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <label class="cursor-pointer px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium flex items-center gap-1 shadow-sm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg> Import</label>
                            <input type="file" id="importFile" class="hidden" onchange="handleImport(event)">
                            <button onclick="toggleModal('analytics')" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-medium shadow-sm flex items-center gap-1">Analytics</button>
                            <button onclick="toggleModal('settings')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-xs font-medium shadow-sm flex items-center gap-1">Settings</button>
                            <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium shadow-sm flex items-center gap-1">Logout</button>
                        </div>
                    </div>

                    <!-- Groups -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="tableContainer"></div>
                </div>`;
                
                renderTableGroups(activeTheme);
                if(appState.showSettings) renderSettingsModal();
                if(appState.showAnalytics) renderAnalyticsModal();
            }
        }

        function renderTableGroups(theme) {
            const container = document.getElementById('tableContainer');
            const groups = [{id:'group1', name:'INBOX', color:theme.acc},{id:'group2', name:'COMPLETED', color:theme.hl}];
            
            groups.forEach(g => {
                const gTasks = appState.tasks.filter(t=>t.group===g.id);
                let tableHTML = `<table class="min-w-full bg-white rounded-lg shadow-sm overflow-hidden border border-gray-200">`;
                
                // Header
                tableHTML += `<thead><tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">`;
                appState.columnOrder.forEach(c => {
                    const w = appState.columnWidths[c] || 150;
                    tableHTML += `<th style="min-width:${w}px" class="px-4 py-3 text-left relative group/th select-none">${appState.columns[c]?.label || c} <div class="absolute right-0 top-0 bottom-0 w-2 cursor-col-resize bg-blue-500 opacity-0 group-hover/th:opacity-100 rounded-r" onmousedown="startColResize(event,'${c}')"></div></th>`;
                });
                tableHTML += `</tr></thead><tbody class="divide-y divide-gray-100">`;

                // Rows
                gTasks.forEach(t => {
                    tableHTML += `<tr data-id="${t.id}" draggable="true" ondragstart="onRowDragStart(event,${t.id})" ondragover="event.preventDefault()" ondrop="onRowDrop(event,${g.id})" class="hover:bg-blue-50 transition-colors ${appState.dragInfo?.id===t.id?'dragging':''}">`;
                    appState.columnOrder.forEach(c => {
                        tableHTML += `<td style="min-width:${appState.columnWidths[c]}px" class="px-4 py-2 text-sm">${renderCellContent(c, t, theme)}</td>`;
                    });
                    tableHTML += `</tr>`;
                });
                tableHTML += `</tbody></table><div class="p-3 flex gap-2"><button onclick="addRow('${g.id}')" class="px-3 py-1.5 text-white rounded-lg text-xs font-medium shadow-sm" style="background:${theme.primary}">+ Add Item</button></div>`;
                
                container.innerHTML += `<div><div class="flex items-center gap-2 px-4 py-3 rounded-t-lg mb-2 font-bold text-white" style="background:${g.color}"><span>${g.name}</span> <span class="bg-white/20 px-2 py-0.5 rounded-full text-xs">${gTasks.length}</span></div>${tableHTML}</div>`;
            });
        }

        function renderCellContent(col, task, theme) {
            switch(col) {
                case 'branchOfService': 
                    const bc = branchColors[task.branch] || '#9ca3af';
                    return `<button onclick="toggleBranchMenu(this,'${task.id}')" style="background:${bc};color:${getContrastColor(bc)}" class="w-full text-left px-3 py-2 rounded-lg font-medium text-xs hover:opacity-90">${task.branch||'Not started'}</button>`;
                case 'timestamp': case 'etsDate': case 'terminalLeave':
                    return `<input type="date" value="${task[col]||''}" onchange="updateField('${task.id}','${col}',this.value)" class="w-full px-2 py-1 border rounded text-xs focus:ring-2 focus:ring-blue-500 outline-none bg-white">`;
                case 'pipelineStatus': return `<input type="text" value="${task.pipelineStatus||''}" onchange="updateField('${task.id}','pipelineStatus',this.value)" class="w-full px-2 py-1 border rounded text-xs bg-white">`;
                default: return `<input type="text" value="${task[col]||''}" onchange="updateField('${task.id}','${col}',this.value)" class="w-full px-2 py-1 border rounded text-xs bg-transparent focus:bg-white focus:border-blue-500 outline-none">`;
            }
        }

        // ==========================================
        // 6. INTERACTION LOGIC
        // ==========================================
        function handleLogin(e) { e.preventDefault(); auth.signInWithEmailAndPassword(appState.email, appState.password).catch(err => { appState.authError=err.message; render(); }); }
        function handleLogout() { auth.signOut(); }
        
        function updateField(id, field, val) {
            const idx = appState.tasks.findIndex(t=>t.id==id);
            if(idx===-1) return;
            appState.tasks[idx][field] = val;
            if(field==='pipelineStatus') appState.tasks[idx].group = val.toLowerCase()=='done'?'group2':'group1';
            // Sync triggers automatically via watcher
        }

        function addRow(group) {
            const newId = Math.max(...appState.tasks.map(t=>t.id), 0) + 1;
            const newRow = { id:newId, group:group, branch:'Not started', timestamp:new Date().toISOString().split('T')[0], fullName:'New User' };
            appState.tasks.unshift(newRow); // Add to top of INBOX
        }

        function toggleBranchMenu(btn, id) {
            const exists = document.getElementById(`branch-menu-${id}`);
            if(exists) return exists.remove();
            
            const menu = document.createElement('div');
            menu.id = `branch-menu-${id}`;
            menu.className = 'absolute z-50 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 p-2 calendar-popup';
            menu.style.width = '180px';
            menu.innerHTML = Object.keys(branchColors).map(b => 
                `<button onclick="updateField('${id}','branch','${b}'); document.getElementById('branch-menu-${id}').remove()" class="w-full text-left px-3 py-2 rounded hover:bg-gray-50 text-xs font-medium flex items-center gap-2" style="color:${getContrastColor(branchColors[b])}; background:${branchColors[b]}">${b}</button>`
            ).join('');
            
            btn.style.position = 'relative';
            btn.appendChild(menu);
            setTimeout(() => document.addEventListener('click', () => { if(!menu.contains(document.activeElement)) menu.remove(); }, {once:true}), 10);
        }

        // Drag & Drop for Rows
        function onRowDragStart(e, id) { appState.dragInfo = {id}; e.dataTransfer.setData('text/plain', id); e.currentTarget.classList.add('dragging'); }
        function onRowDrop(e, targetGroup) { 
            e.preventDefault(); 
            if(!appState.dragInfo) return;
            const tIdx = appState.tasks.findIndex(t=>t.id==appState.dragInfo.id);
            if(tIdx>-1) { appState.tasks[tIdx].group = targetGroup; }
            appState.dragInfo = null; renderTableGroups({acc:'#D8973C',hl:'#BD632F'}); // Simplified re-render trigger
        }

        function handleImport(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = ev => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(data.tasks) appState.tasks = [...appState.tasks, ...data.tasks.filter(t=>!appState.tasks.find(x=>x.id===t.id))];
                    alert('Import successful!'); render();
                } catch(err) { alert('Invalid file format.'); }
            };
            r.readAsText(f);
        }

        function toggleModal(type) { appState['show'+type.charAt(0).toUpperCase()+type.slice(1)] = !appState['show'+type.charAt(0).toUpperCase()+type.slice(1)]; render(); }
        
        function renderAnalyticsModal() {
            const counts = {};
            appState.tasks.forEach(t => { const b=t.branch||'Unspecified'; counts[b]=(counts[b]||0)+1; });
            const max = Math.max(...Object.values(counts),1);
            let chartHTML = Object.keys(counts).map(k=>`<div class="flex flex-col items-center w-full"><div class="w-full bg-blue-500 rounded-t transition-all" style="height:${(counts[k]/max)*150}px"></div><span class="text-[10px] mt-1 truncate w-full text-center">${k}</span></div>`).join('');
            
            document.getElementById('app').insertAdjacentHTML('afterbegin', `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-xl shadow-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto animate-scale-in relative">
                        <button onclick="toggleModal('analytics')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                        <h3 class="text-2xl font-bold mb-4 text-gray-900">Analytics Dashboard</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><h4 class="font-bold mb-4 text-sm text-gray-700">Branch Distribution</h4><div class="flex items-end justify-around h-48 pb-4 border-b border-gray-300 px-2">${chartHTML}</div></div>
                            <div class="p-4 bg-gray-50 rounded-lg border border-gray-200"><h4 class="font-bold mb-4 text-sm text-gray-700">Status Pipeline</h4><div class="space-y-3">${Object.entries(counts).map(([k,v])=>`<div class="flex justify-between text-sm"><span>${k}</span><span class="font-bold">${v}</span></div>`).join('')}</div></div>
                        </div>
                    </div>
                </div>
            `);
        }

        function renderSettingsModal() {
             const themes = {...defaultThemes, ...appState.customThemes};
             document.getElementById('app').insertAdjacentHTML('afterbegin', `
                <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-xl shadow-2xl p-6 max-w-lg w-full animate-scale-in relative">
                        <button onclick="toggleModal('settings')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
                        <h3 class="text-xl font-bold mb-6 text-gray-900">Settings</h3>
                        <div class="space-y-4">
                            <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg cursor-pointer"><span class="font-semibold text-sm">Dark Mode</span><input type="checkbox" ${appState.settings.darkMode?'checked':''} onchange="updateSetting('darkMode',this.checked)" class="w-5 h-5 text-blue-600"></label>
                            <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg cursor-pointer"><span class="font-semibold text-sm">Use Theme</span><input type="checkbox" ${appState.settings.useTheme?'checked':''} onchange="updateSetting('useTheme',this.checked)" class="w-5 h-5 text-blue-600"></label>
                            <div class="flex gap-2 flex-wrap">${Object.keys(themes).map(k=>`<button onclick="updateSetting('colorTheme','${k}')" class="w-8 h-8 rounded-full border-2 ${appState.settings.colorTheme===k?'border-blue-500':'border-gray-300'}" style="background:${themes[k].primary}" title="${k}"></button>`).join('')}</div>
                        </div>
                    </div>
                </div>
            `);
        }

        function updateSetting(key, val) { 
            appState.settings[key] = val; 
            render(); // Triggers save via watcher
        }

        // ==========================================
        // 7. INITIALIZATION
        // ==========================================
        auth.onAuthStateChanged(user => { 
            appState.user = user; 
            if(user) initSync(user); 
            else { appState.loading=false; render(); } 
        });
        
        // Initial load from local storage fallback
        appState.columns = loadLocal('cols', initialColumns);
        appState.columnOrder = loadLocal('ord', initialOrder);
        appState.settings = loadLocal('sett', appState.settings);
        
        // Start the engine
        setTimeout(() => { appState.loading=false; render(); }, 100);

    </script>
</body>
</html>
